# Kleit — a debug Android app on every push to main that touches the app (roadmap M8.0).
# The owner side-loads the APK from the run's artifacts onto the older Android (M8.1a, OW5);
# nothing is signed for a store here - that is M8.1b, after the Play Console account exists.
name: android

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - name: Build the web app and copy it into the Android shell
        run: bun run build:native
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Read the APK back
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          ls -l "$apk"
          unzip -l "$apk" | grep -q "assets/public/index.html" || { echo "the web app is not inside the APK"; exit 1; }
          # M8.5: the drawn decorations and thumbnails ship inside; the museum photographs do not.
          unzip -l "$apk" | grep -q "assets/public/library/drawn/" || { echo "the drawn decorations are not inside the APK"; exit 1; }
          unzip -l "$apk" | grep -q "assets/public/library/thumbs/" || { echo "the thumbnails are not inside the APK"; exit 1; }
          if unzip -l "$apk" | grep -q "assets/public/library/cutouts/"; then echo "the museum photographs are inside the APK (they should come from the site)"; exit 1; fi
          echo "APK ok: $(du -h "$apk" | cut -f1), web app inside, museum photographs left out"
      - uses: actions/upload-artifact@v4
        with:
          name: kleit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
