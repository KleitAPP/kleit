# Kleit — app checks on every push to main (roadmap M1.3, M1.16).
#   theme  — no hard-coded colours/fonts/sizes on screens; every text colour ≥ 4.5:1 in both themes
#   version— the rule that decides whether the forced-update screen shows (roadmap M1.14)
#   build  — the SPA still builds to static files (decision 109: Capacitor and Cloudflare need that)
name: app

on:
  push:
    branches: [main]
    # Words alone change nothing the checks look at (WA19: minutes).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

# A newer push to main makes the older run's answer moot; stop it (WA19: minutes). The core loop
# and the attack keep their own groups and are never cut short - their `finally` puts things back.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Theme check
        run: node scripts/check-theme.mjs
      - name: Version rule check
        run: bun scripts/check-version-rule.ts
      # A fingerprint that quietly stops matching lets a removed image back in, and nothing else
      # in the system would notice. So it is checked on every push, not once when it was written.
      - name: Image fingerprint check
        run: bun scripts/check-fingerprint.ts
      # The table that decides whether a photo is visible. A change to it that nobody notices is
      # the worst kind of change in the app: one way people see what they should not, the other a
      # seller's ordinary product shot vanishes.
      - name: Image screening decision check
        run: bun scripts/check-screening.ts
      # The server's second look at photo metadata. The phone strips it before the photo leaves;
      # this is what would notice if a phone ever did not.
      - name: Photo metadata check
        run: bun scripts/check-metadata.ts
      # The store-page reader and the door it fetches through: private addresses refused,
      # tracking codes stripped, four shapes of product page read right (M2.4).
      - name: Product page reader check
        run: bun scripts/check-product-page.ts
      - name: The Creative canvas document's rules (cap, undo, snapping, order)
        run: bun scripts/check-canvas-doc.ts
      - name: Every shipped font has its licence recorded
        run: node scripts/check-fonts.mjs
      - name: A risky search shows the help card; a clothes search does not (M7.6)
        run: bun scripts/check-risky.mjs
      # Every picture in the decoration library has a licence row, and the catalogue the drawer
      # reads matches the records (artwork pack gap A9).
      - name: The held-phrase list in the database is the help card's list (M7.1)
        run: node scripts/check-held-phrases.mjs
      - name: Every decoration has its licence recorded
        run: node scripts/build-library.mjs --check
      - name: Type check
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
