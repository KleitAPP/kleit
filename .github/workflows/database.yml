# Kleit — database pipeline (technical pack §6, security plan #3 and #22)
# Runs on every push to main that touches supabase/, and by hand from the Actions tab.
#   1. migrate — applies supabase/migrations/ to kleit-test, in timestamp order, then pushes
#                supabase/config.toml, so auth settings are a reviewed file, not dashboard clicks
#   2. test    — runs the RLS test suite in supabase/tests/database/ against kleit-test
#   3. types   — regenerates src/integrations/supabase/types.ts and commits it if it changed
#   4. functions — deploys supabase/functions/ and hands them their secrets. Runs AFTER the tests,
#                  because a function that screens images must never be live against a database
#                  whose rules have just failed their own checks.
# Secrets (pasted by the owner in GitHub → Settings → Secrets; never in chat or code):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   (the sweep secret is not one of them: CI makes it fresh on every deploy, see below)
name: database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

concurrency:
  group: database-kleit-test
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: zoimaafxtweeoqnmrbkh
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link kleit-test
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
      # Auth settings (code length, expiry, the per-device limit on wrong codes, the sign-in
      # email) come from supabase/config.toml. Printed first so the run log shows what changed.
      - name: Show auth config
        run: cat supabase/config.toml
      # config push asks "Do you want to push auth config to remote? [y/N]". With no terminal the
      # default N wins, so it prints its plan and changes nothing -- which is exactly what the
      # read-back below caught on 2026-09-25. One "y" then end-of-input: `yes |` keeps the pipe
      # open for ever and the command never returns.
      # The two secrets config.toml refers to with env(...). They are never in the repository;
      # they arrive here from GitHub secrets and go straight to Supabase. If either is missing the
      # step below fails loudly rather than pushing an empty password, which would silently stop
      # every sign-in email.
      - name: Check the auth secrets are present
        run: |
          test -n "$SUPABASE_AUTH_SMTP_PASS" || { echo "::error::SUPABASE_AUTH_SMTP_PASS is not set"; exit 1; }
          test -n "$SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET" || { echo "::error::SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET is not set"; exit 1; }
        env:
          SUPABASE_AUTH_SMTP_PASS: ${{ secrets.SUPABASE_AUTH_SMTP_PASS }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
      - name: Apply auth config
        timeout-minutes: 3
        env:
          SUPABASE_AUTH_SMTP_PASS: ${{ secrets.SUPABASE_AUTH_SMTP_PASS }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
        run: printf 'y\n' | supabase config push --project-ref "$SUPABASE_PROJECT_REF"
      # Read back what the project actually holds now. When a sign-in email comes out wrong, this
      # is the difference between guessing and knowing.
      - name: Auth config, as the project now holds it
        run: supabase config diff --project-ref "$SUPABASE_PROJECT_REF" || true

  test:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link kleit-test
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: RLS test suite
        run: supabase test db --linked

  types:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate types
        run: supabase gen types typescript --project-id "$SUPABASE_PROJECT_REF" --schema public > src/integrations/supabase/types.ts
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "types.ts unchanged"
          else
            git config user.name "kleit-ci"
            git config user.email "kleit-ci@users.noreply.github.com"
            git add src/integrations/supabase/types.ts
            git commit -m "chore: regenerate Supabase types [skip ci]"
            git push
          fi

  functions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The scanner's key pair lives in Supabase's own secret store, not in the function's code and
      # not in this repository. It gets there from GitHub secrets, once, on every deploy - so
      # rotating the key is a paste in one place and a push.
      - name: Check the scanner's keys are present
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::AWS_ACCESS_KEY_ID is not set"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::AWS_SECRET_ACCESS_KEY is not set"; exit 1; }
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The sweep secret (migration 014) is made fresh here on every deploy and put in the two
      # places that need it - the sweeper's environment and the database's vault - so it is never
      # pasted anywhere, never in a chat, and rotates itself. `::add-mask::` keeps it out of the log.
      - name: Make this deploy's sweep secret
        run: |
          SWEEP_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SWEEP_SECRET"
          echo "SWEEP_SECRET=$SWEEP_SECRET" >> "$GITHUB_ENV"
      - name: Give the functions their secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" \
            "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" \
            "SWEEP_SECRET=$SWEEP_SECRET"
      - name: Deploy ingest-image
        run: supabase functions deploy ingest-image --project-ref "$SUPABASE_PROJECT_REF"
      # The sweeper is called by the database, which holds no user token, so the gateway's JWT
      # check is off for this one function. It checks the sweep secret itself instead.
      - name: Deploy sweep-images
        run: supabase functions deploy sweep-images --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      # Buy links must work for a signed-out visitor on a shared page, so no token is asked for.
      # It reads one row and writes one that cannot name a person (migration 015).
      - name: Deploy buy-redirect
        run: supabase functions deploy buy-redirect --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy clip-url
        run: supabase functions deploy clip-url --project-ref "$SUPABASE_PROJECT_REF"
      # Pictures of cleared catalogue items, for <img> tags, so no token: the gate is the item's
      # own screening state, and the id is unguessable.
      - name: Deploy item-image
        run: supabase functions deploy item-image --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      # Guest votes come from people with no account, so no gateway token; the function checks
      # Turnstile and the limits itself, and the database's record_vote is service-role only.
      - name: Deploy cast-vote
        run: supabase functions deploy cast-vote --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      # The chat picture, drawn by the server for the set's owner (their token is checked).
      - name: Deploy set-preview
        run: supabase functions deploy set-preview --project-ref "$SUPABASE_PROJECT_REF"
      # A private-font text layer as a picture, for the shared page's <img> tags: no token.
      - name: Deploy text-image
        run: supabase functions deploy text-image --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      # The takedown forms' door: no account, so no token; Turnstile and a daily limit inside.
      - name: Deploy takedown-request
        run: supabase functions deploy takedown-request --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy contact-form
        run: supabase functions deploy contact-form --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      # Deletes taken-down and long-deleted pictures from storage; called by the nightly cleanup
      # through pg_net with the sweep secret (migration 057), never by a person.
      - name: Deploy purge-files
        run: supabase functions deploy purge-files --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      # The database's half of the secret, plus the sweeper's address. Written through the
      # session-mode pooler (the direct host is IPv6-only and GitHub's runners are IPv4).
      - name: Put the sweep secret and address in the vault
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -q postgresql-client
          POOLER="$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          HOST="$(echo "$POOLER" | jq -r '.[0].db_host')"
          USER="$(echo "$POOLER" | jq -r '.[0].db_user')"
          test -n "$HOST" -a "$HOST" != "null" || { echo "::error::could not read the pooler host"; exit 1; }
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          psql "host=$HOST port=5432 user=$USER dbname=postgres sslmode=require" -v ON_ERROR_STOP=1 \
            -v url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/sweep-images" \
            -v secret="$SWEEP_SECRET" <<'SQL'
          select set_config('kleit.url', :'url', false), set_config('kleit.secret', :'secret', false);
          do $$
          declare v_id uuid;
          begin
            select id into v_id from vault.secrets where name = 'sweep_url';
            if v_id is null then perform vault.create_secret(current_setting('kleit.url'), 'sweep_url');
            else perform vault.update_secret(v_id, current_setting('kleit.url')); end if;
            select id into v_id from vault.secrets where name = 'sweep_secret';
            if v_id is null then perform vault.create_secret(current_setting('kleit.secret'), 'sweep_secret');
            else perform vault.update_secret(v_id, current_setting('kleit.secret')); end if;
          end $$;
          -- Read back, not trusted: the names must be there and the address must be ours.
          select name, length(decrypted_secret) as chars from vault.decrypted_secrets
            where name in ('sweep_url', 'sweep_secret') order by name;
          SQL
      # Read back what is actually deployed, rather than trusting that deploy said so (lesson L24).
      - name: Functions, as the project now holds them
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
      # The sweeper, proven rather than assumed: fire the timer's own function once by hand, give
      # the HTTP call time to come back, and read what the database recorded - the reply status
      # from pg_net, the last few timer runs, and how many items were claimed. A 401 here means the
      # vault and the function disagree about the secret; anything but 200 fails the run.
      - name: Prove the sweeper runs
        run: |
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          POOLER="$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          HOST="$(echo "$POOLER" | jq -r '.[0].db_host')"
          USER="$(echo "$POOLER" | jq -r '.[0].db_user')"
          DSN="host=$HOST port=5432 user=$USER dbname=postgres sslmode=require"
          psql "$DSN" -v ON_ERROR_STOP=1 -c "select private.sweep_scans()"
          sleep 75
          psql "$DSN" -v ON_ERROR_STOP=1 <<'SQL'
          select id, status_code, left(content::text, 200) as reply, created
            from net._http_response order by id desc limit 3;
          select jobid, status, left(return_message, 80) as message, start_time
            from cron.job_run_details
            where jobid = (select jobid from cron.job where jobname = 'sweep-images')
            order by start_time desc limit 3;
          select scan_state, attempts, count(*) from public.item_flags
            group by scan_state, attempts order by 1, 2;
          SQL
          STATUS="$(psql "$DSN" -tA -c "select status_code from net._http_response order by id desc limit 1")"
          test "$STATUS" = "200" || { echo "::error::the sweeper answered $STATUS, not 200"; exit 1; }
      # The Buy redirect, proven the same way (M2.7 "Done when"): a throwaway item with a store
      # address, one tap through the live function, and then the database read back - a 302 to
      # exactly that address, one click row with a random id, and no column that could name who.
      - name: Prove the Buy redirect
        run: |
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          POOLER="$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          HOST="$(echo "$POOLER" | jq -r '.[0].db_host')"
          USER="$(echo "$POOLER" | jq -r '.[0].db_user')"
          DSN="host=$HOST port=5432 user=$USER dbname=postgres sslmode=require"
          # Any throwaway a failed earlier run left behind goes first.
          psql "$DSN" -q -c "delete from public.items where title = 'CI throwaway'"
          ITEM="$(psql "$DSN" -tAq -v ON_ERROR_STOP=1 -c "
            insert into public.items (owner_id, kind, title, source_url, source_domain, store_name)
            select id, 'product', 'CI throwaway', 'https://example.com/ci-buy-check?x=1', 'example.com', 'Example'
            from auth.users order by created_at limit 1 returning id" | head -1)"
          test -n "$ITEM" || { echo "::error::could not make the throwaway item"; exit 1; }
          echo "throwaway item $ITEM"
          FN="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/buy-redirect"
          # A tap. -o /dev/null so nothing is followed; we want the redirect itself.
          curl -sS -o /dev/null -D /tmp/buy-headers.txt "$FN?item=$ITEM&network=direct"
          cat /tmp/buy-headers.txt
          grep -qi "^HTTP/.* 302" /tmp/buy-headers.txt || { echo "::error::Buy did not answer 302"; exit 1; }
          grep -qi "^location: https://example.com/ci-buy-check?x=1" /tmp/buy-headers.txt || { echo "::error::Buy did not point at the stored address"; exit 1; }
          # An address in the query must never be followed.
          CODE="$(curl -sS -o /dev/null -w "%{http_code}" "$FN?item=$ITEM&url=https://evil.example")"
          test "$CODE" = "302" || { echo "::error::Buy with a smuggled url answered $CODE, not 302"; exit 1; }
          curl -sS -o /dev/null -w "%{http_code}\n" "$FN?item=00000000-0000-4000-8000-000000000000" | grep -q "^404$" || { echo "::error::an unknown item should be 404"; exit 1; }
          psql "$DSN" -v ON_ERROR_STOP=1 -c "select click_id, network, set_id, created_at from public.clicks where item_id = '$ITEM'"
          N="$(psql "$DSN" -tA -c "select count(*) from public.clicks where item_id = '$ITEM'")"
          test "$N" = "2" || { echo "::error::expected 2 clicks recorded, found $N"; exit 1; }
          psql "$DSN" -tA -c "select count(*) from information_schema.columns where table_name='clicks' and (column_name ilike '%user%' or column_name ilike '%email%')" | grep -q "^0$" || { echo "::error::clicks has a column that could name a person"; exit 1; }
          psql "$DSN" -v ON_ERROR_STOP=1 -c "delete from public.items where id = '$ITEM'"
      # The gate itself, proven (M2.5 "Done when"; spec 13.1 #5): a picture that has been removed
      # may never come back. A throwaway picture is screened once (clean - this also proves the
      # AWS call from here), its fingerprint is put on the never-again list, the same picture is
      # uploaded again, and the sweeper must block it and leave it invisible. Both runs go through
      # the deployed sweeper with this deploy's own secret.
      # CL42: a taken-down picture leaves its bucket (kept in `evidence` first), a 30-day-old
      # deletion leaves it with no copy, and a live picture is untouched. Read back from storage
      # and the row, not from the function's reply (L24).
      - name: Prove the purge
        run: |
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          POOLER="$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          HOST="$(echo "$POOLER" | jq -r '.[0].db_host')"
          USER="$(echo "$POOLER" | jq -r '.[0].db_user')"
          DSN="host=$HOST port=5432 user=$USER dbname=postgres sslmode=require"
          KEY="$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')"
          test -n "$KEY" -a "$KEY" != "null" || { echo "::error::could not read the service key"; exit 1; }
          echo "::add-mask::$KEY"
          BASE="https://$SUPABASE_PROJECT_REF.supabase.co"
          OWNER="$(psql "$DSN" -tAq -c "select id from auth.users order by created_at limit 1")"
          psql "$DSN" -q -c "delete from public.items where title like 'CI purge %'"
          python3 -m pip install -q pillow
          python3 -c "from PIL import Image; Image.new('RGB',(48,48),(90,160,90)).save('/tmp/purge.jpg','JPEG',quality=85)"
          P_DOWN="$OWNER/ci-purge-down.jpg"; P_OLD="$OWNER/ci-purge-old.jpg"; P_LIVE="$OWNER/ci-purge-live.jpg"
          for P in "$P_DOWN" "$P_OLD" "$P_LIVE"; do
            curl -sS -o /dev/null -w "upload $P: %{http_code}\n" -X POST "$BASE/storage/v1/object/closet-photos/$P" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: image/jpeg" -H "x-upsert: true" --data-binary @/tmp/purge.jpg
          done
          DOWN="$(psql "$DSN" -tAq -v ON_ERROR_STOP=1 -c "insert into public.items (owner_id, kind, title, image_bucket, image_id, takedown_state) values ('$OWNER', 'own', 'CI purge down', 'closet-photos', '$P_DOWN', 'removed') returning id" | head -1)"
          OLD="$(psql "$DSN" -tAq -v ON_ERROR_STOP=1 -c "insert into public.items (owner_id, kind, title, image_bucket, image_id, deleted_at) values ('$OWNER', 'own', 'CI purge old', 'closet-photos', '$P_OLD', now() - interval '40 days') returning id" | head -1)"
          LIVE="$(psql "$DSN" -tAq -v ON_ERROR_STOP=1 -c "insert into public.items (owner_id, kind, title, image_bucket, image_id) values ('$OWNER', 'own', 'CI purge live', 'closet-photos', '$P_LIVE') returning id" | head -1)"
          # The purge takes twenty at a time; the test project may hold other due rows, so loop.
          for round in $(seq 1 10); do
            curl -sS -o /tmp/purge.json -X POST "$BASE/functions/v1/purge-files" -H "x-sweep-key: $SWEEP_SECRET" -H "Content-Type: application/json" -d '{}'
            LEFT="$(psql "$DSN" -tAq -c "select count(*) from public.items where id in ('$DOWN','$OLD') and purged_at is null")"
            echo "  round $round: $(head -c 120 /tmp/purge.json) ... left=$LEFT"
            test "$LEFT" = "0" && break
          done
          object_status() { curl -sS -o /dev/null -w "%{http_code}" "$BASE/storage/v1/object/$1" -H "Authorization: Bearer $KEY"; }
          S_DOWN="$(object_status "closet-photos/$P_DOWN")"; S_OLD="$(object_status "closet-photos/$P_OLD")"; S_LIVE="$(object_status "closet-photos/$P_LIVE")"
          S_EVIDENCE="$(object_status "evidence/takedowns/$DOWN")"
          PURGED="$(psql "$DSN" -tAq -c "select count(*) from public.items where id in ('$DOWN','$OLD') and purged_at is not null")"
          LIVE_PURGED="$(psql "$DSN" -tAq -c "select purged_at is not null from public.items where id = '$LIVE'")"
          echo "down=$S_DOWN old=$S_OLD live=$S_LIVE evidence=$S_EVIDENCE purged_rows=$PURGED live_purged=$LIVE_PURGED"
          test "$S_DOWN" = "400" -o "$S_DOWN" = "404" || { echo "::error::the taken-down picture is still in its bucket ($S_DOWN)"; exit 1; }
          test "$S_OLD" = "400" -o "$S_OLD" = "404" || { echo "::error::the 40-day-old deletion's picture is still in its bucket ($S_OLD)"; exit 1; }
          test "$S_LIVE" = "200" || { echo "::error::the live picture was touched ($S_LIVE)"; exit 1; }
          test "$S_EVIDENCE" = "200" || { echo "::error::no evidence copy of the taken-down picture ($S_EVIDENCE)"; exit 1; }
          test "$PURGED" = "2" || { echo "::error::purged_at not set on both rows ($PURGED)"; exit 1; }
          test "$LIVE_PURGED" = "f" || { echo "::error::the live row was marked purged"; exit 1; }
          psql "$DSN" -q -c "delete from public.items where id in ('$DOWN','$OLD','$LIVE')"
          curl -sS -o /dev/null -X DELETE "$BASE/storage/v1/object/closet-photos/$P_LIVE" -H "Authorization: Bearer $KEY"
          curl -sS -o /dev/null -X DELETE "$BASE/storage/v1/object/evidence/takedowns/$DOWN" -H "Authorization: Bearer $KEY"
      - name: Prove a removed picture stays removed
        run: |
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          POOLER="$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          HOST="$(echo "$POOLER" | jq -r '.[0].db_host')"
          USER="$(echo "$POOLER" | jq -r '.[0].db_user')"
          DSN="host=$HOST port=5432 user=$USER dbname=postgres sslmode=require"
          KEY="$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')"
          test -n "$KEY" -a "$KEY" != "null" || { echo "::error::could not read the service key"; exit 1; }
          echo "::add-mask::$KEY"
          BASE="https://$SUPABASE_PROJECT_REF.supabase.co"
          OWNER="$(psql "$DSN" -tAq -c "select id from auth.users order by created_at limit 1")"
          psql "$DSN" -q -c "delete from public.items where title like 'CI never-again %'; delete from public.removed_image_fingerprints where reason = 'CI throwaway'"
          # A plain, obviously harmless picture: two flat colour blocks.
          python3 -m pip install -q pillow
          python3 -c "from PIL import Image; im=Image.new('RGB',(96,64),(240,140,40)); im.paste((20,30,120),(0,32,96,64)); im.save('/tmp/never.jpg','JPEG',quality=90)"
          PATH_A="$OWNER/ci-never-again-a.jpg"; PATH_B="$OWNER/ci-never-again-b.jpg"
          for P in "$PATH_A" "$PATH_B"; do
            curl -sS -o /dev/null -w "upload $P: %{http_code}\n" -X POST "$BASE/storage/v1/object/item-images/$P" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: image/jpeg" -H "x-upsert: true" --data-binary @/tmp/never.jpg
          done
          # Sweeps until the given item has a verdict. The sweeper takes ten at a time, oldest
          # first, so when the fake catalogue has just been seeded it can take a few rounds.
          sweep_until() {
            for round in $(seq 1 15); do
              curl -sS -o /tmp/sweep.json -X POST "$BASE/functions/v1/sweep-images" -H "x-sweep-key: $SWEEP_SECRET" -H "Content-Type: application/json" -d '{}'
              STATE="$(psql "$DSN" -tAq -c "select scan_state from public.item_flags where item_id = '$1'")"
              echo "  round $round: $(head -c 80 /tmp/sweep.json) ... state=$STATE"
              test -n "$STATE" -a "$STATE" != "pending" && return 0
            done
            return 1
          }
          A="$(psql "$DSN" -tAq -v ON_ERROR_STOP=1 -c "insert into public.items (owner_id, kind, title, image_bucket, image_id, created_at) values ('$OWNER', 'own', 'CI never-again A', 'item-images', '$PATH_A', now() - interval '3 minutes') returning id" | head -1)"
          echo "first pass:"; sweep_until "$A" || true
          HASH="$(psql "$DSN" -tAq -c "select image_hash from public.items where id = '$A'")"
          STATE_A="$(psql "$DSN" -tAq -c "select scan_state from public.item_flags where item_id = '$A'")"
          echo "A: state=$STATE_A hash=$HASH"
          test "$STATE_A" = "clean" || { echo "::error::the first pass should have been clean, was '$STATE_A'"; exit 1; }
          test -n "$HASH" || { echo "::error::no fingerprint stored for A"; exit 1; }
          psql "$DSN" -v ON_ERROR_STOP=1 -q -c "insert into public.removed_image_fingerprints (image_hash, reason) values ('$HASH', 'CI throwaway')"
          B="$(psql "$DSN" -tAq -v ON_ERROR_STOP=1 -c "insert into public.items (owner_id, kind, title, image_bucket, image_id, created_at) values ('$OWNER', 'own', 'CI never-again B', 'item-images', '$PATH_B', now() - interval '3 minutes') returning id" | head -1)"
          echo "second pass:"; sweep_until "$B" || true
          STATE_B="$(psql "$DSN" -tAq -c "select scan_state from public.item_flags where item_id = '$B'")"
          CLEARED_B="$(psql "$DSN" -tAq -c "select private.image_cleared('$B')")"
          echo "B: state=$STATE_B cleared=$CLEARED_B"
          test "$STATE_B" = "blocked" || { echo "::error::the removed picture came back as '$STATE_B', not blocked"; exit 1; }
          test "$CLEARED_B" = "f" || { echo "::error::a blocked picture reads as cleared"; exit 1; }
          psql "$DSN" -q -c "delete from public.items where id in ('$A', '$B'); delete from public.removed_image_fingerprints where reason = 'CI throwaway'"
          for P in "$PATH_A" "$PATH_B"; do
            curl -sS -o /dev/null -X DELETE "$BASE/storage/v1/object/item-images/$P" -H "Authorization: Bearer $KEY"
          done
