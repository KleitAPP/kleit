# Kleit — launch-gate smoke test (roadmap M1.14).
# Drives the deployed test site with a real browser and checks that the emergency switches block
# the app when they should, and — the one that matters most — that the app still opens when the
# switches cannot be read at all, instead of hanging on the splash screen (lesson L22).
#
# Not on every push: it needs a browser and a deployed site, so it runs on demand and after the
# app workflow finishes, once the new bundle is live.
name: launch-gate

on:
  workflow_dispatch:
  # The photo check below guards a promise made to people rather than a feature, so it runs on
  # every change to the code it covers - not only on the weekly schedule.
  push:
    branches: [main]
    paths:
      - "src/photos/**"
      - "scripts/check-photo-prepare.mjs"
      - "scripts/check-cutout.mjs"
      - "src/offline/**"
      - "scripts/check-offline.mjs"
      - "src/native/**"
      - "scripts/check-incoming.mjs"
      - "scripts/fixtures/**"
      - ".github/workflows/launch-gate.yml"
  schedule:
    # Once a week, so a change somewhere else cannot quietly break the one screen that can lock
    # everybody out. Tuesdays, 07:13 UTC.
    - cron: "13 7 * * 2"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --no-save so the repo's lockfile and the per-push checks stay untouched by a browser dep.
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Launch-gate smoke test
        run: node scripts/check-launch-gate.mjs

  photos:
    # Only the browser-needing part of the photo work. A canvas exists in a browser and nowhere
    # else, so this cannot live with the per-push checks that run without one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1 esbuild
          npx playwright install --with-deps chromium
      - name: A photo loses its location before it leaves the phone
        run: node scripts/check-photo-prepare.mjs
      # The cutout editor's mask: erase, restore, undo and reset, and that the photo itself is
      # never painted on. Same real browser, same real module (M2.6).
      - name: The cutout editor cuts, restores and undoes exactly
        run: node scripts/check-cutout.mjs
      # The on-phone store for offline use: lists and pictures come back as they went in, edits
      # queue in order, and a lost connection is told apart from a refusal (M8.5).
      - name: The offline store keeps and replays in order
        run: node scripts/check-offline.mjs
      # A share or a link that reaches the phone app goes to the right screen (M8.2 / M8.7).
      - name: A share or a link that reaches the app lands on the right screen
        run: node scripts/check-incoming.mjs
