<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kleit</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #161513;
        background: #faf9f7;
        margin: 0;
        padding: 16px;
        width: 320px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #6b6862;
        margin: 0 0 12px;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 13px;
        color: #6b6862;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        min-height: 40px;
        border: 1px solid #e5e3de;
        border-radius: 8px;
        padding: 0 10px;
        font-size: 14px;
        background: #fff;
        color: #161513;
      }
      button {
        margin-top: 10px;
        min-height: 40px;
        border: 0;
        border-radius: 999px;
        background: #c0442b;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        padding: 0 16px;
        cursor: pointer;
      }
      #saved {
        font-size: 13px;
        color: #1f7a5c;
        margin-top: 8px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Kleit</h1>
    <p>
      Click the Kleit button on any store page, or right-click a picture, and it opens in Kleit
      ready to clip. Nothing is read from the page by this extension.
    </p>
    <label for="site">Kleit's address</label>
    <input id="site" type="url" placeholder="https://kleit.app" />
    <button id="save" type="button">Save</button>
    <div id="saved" role="status"></div>
    <script src="options.js"></script>
  </body>
</html>
