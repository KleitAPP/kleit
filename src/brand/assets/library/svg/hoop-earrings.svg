  </feComponentTransfer>
  <feComposite in="ngr" in2="SourceAlpha" operator="in" result="grainIn"/>
  <feBlend in="grainIn" in2="shaded" mode="overlay"/>
</filter><filter id="cH" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#241c26" flood-opacity="0.3"/></filter></defs>
