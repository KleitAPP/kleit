  <rect x="106" y="110" width="188" height="44" rx="10" fill="#ffffff" opacity=".14"/>
  <rect x="112" y="300" width="176" height="176" rx="26" fill="#dfe8f2" opacity=".55"/>
  <circle cx="200" cy="388" r="40" fill="#f4f8fc"/>
  <circle cx="200" cy="388" r="40" fill="none" stroke="#98a8bc" stroke-width="2"/>
