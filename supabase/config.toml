project_id = "zoimaafxtweeoqnmrbkh"

# Auth settings live here, not in the dashboard, so that a change to how people sign in is a
# reviewed file with a history like everything else (technical pack section 6 #3). CI applies
# this with `supabase config push` on every push that touches supabase/.

[auth]
# The only addresses Supabase will send people back to after a sign-in. Anything not on this
# list is refused, which is what stops a stolen link redirecting somewhere else.
site_url = "https://kleit-test.kleitapp-team.workers.dev"
additional_redirect_urls = [
  "https://kleit-test.kleitapp-team.workers.dev",
  "https://kleit-test.kleitapp-team.workers.dev/**",
  "http://localhost:3000",
  "http://localhost:3000/**",
]

[auth.email]
enable_signup = true
# The app asks for a 6-digit code (spec 3.1 #3) and the screen has six boxes for it.
# The code arrives because the template further down prints {{ .Token }} and never a link -
# which only became possible once we stopped using Supabase's built-in sender (see the SMTP
# block below, and lesson L26 for the day this comment was a lie).
otp_length = 6
# Ten minutes, matching what the email itself promises (design pack section 6.4).
otp_expiry = 600
# We are not a password app. Nobody confirms an address separately; the code IS the proof.
enable_confirmations = false

# 🔴 The sign-in email CANNOT be set from here yet. Supabase answers:
#   "Email template modification is not available for free tier projects using the default email
#    provider. Please upgrade your plan or configure a custom SMTP provider."
# Until Kleit has its own domain and Resend, the built-in sender uses Supabase's own Magic Link
# template, which sends a LINK and no code - so the 6-digit sign-up cannot be tested end to end.
# The wording we intend is kept in supabase/templates/magic_link.html; turn this block back on
# the day custom SMTP is configured. Leaving it on breaks the whole push, because one rejected
# setting aborts all of them.
# Our own mail sender (2026-09-27). Two reasons, and the second is the one that mattered:
#   1. Supabase's built-in sender does 2 emails an hour, only to addresses on the Supabase team.
#   2. Supabase stopped free-tier projects editing these templates with the built-in sender on
#      3 June 2026 - so the email that went out was THEIR magic-link email, with a link in it and
#      no code, and the six-box screen could not be reached at all. See CL21 and lesson L26.
# Brevo: 300 emails a day, free, no card, sending as the Kleit Gmail as a verified single sender.
# This is temporary. At the domain stage before M8 it becomes kleit.app + Resend, and the only
# lines that change are the four below.
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "bb6d79001@smtp-brevo.com"
# Never in this file. GitHub Actions secret, read at push time (security plan: no key in the repo).
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "kleitapp.team@gmail.com"
sender_name = "Kleit"

# Now that the sender is ours, the template is ours too: a code, when it expires, and what to do
# if it wasn't you. Nothing else - Apple's App Review reads this email and so does every new
# person on their first day.
[auth.email.template.magic_link]
subject = "Your Kleit code: {{ .Token }}"
content_path = "./supabase/templates/magic_link.html"

# Google sign-in (roadmap M1.6). The client id is not a secret - it is handed to every browser
# that starts a sign-in - so it lives here where it can be read and reviewed. The secret does not,
# and never will: it is a GitHub Actions secret, injected at push time.
# The other half of this lives in Google Cloud project kleit-app, where the one thing that makes
# it work is the authorised redirect URI pointing at Supabase's callback, not at our site.
[auth.external.google]
enabled = true
client_id = "877303036038-s5io17cekpnd515omnn0va8u7b2vnrvl.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[auth.rate_limit]
# Wrong codes are limited per device, not per email address (owner's decision, 2026-09-25).
# Ten tries per five minutes from one internet connection, against a code that dies after ten
# minutes, means guessing a 6-digit code needs thousands of separate connections. Limiting per
# email instead would let anyone who knows your address lock you out of your own account.
token_verifications = 10
# Supabase's built-in sender is capped at 2 an hour and only reaches team addresses. Real
# sending waits for our own domain and Resend, at the domain stage before M8.
email_sent = 2

# The sweeper (migration 014) is called by the database on a timer, which carries no user token,
# so the gateway's token check is off for this one function. It checks a secret of its own
# instead - see supabase/functions/sweep-images/index.ts.
[functions.sweep-images]
verify_jwt = false

# Buy links open from shared pages by people with no account, so no token is asked for. The
# function only ever redirects to the address stored on the item (never one from the query).
[functions.buy-redirect]
verify_jwt = false

# The picture of a cleared catalogue item, for <img> tags. It answers only for a product that
# screening has cleared, with a signed address that dies in ten minutes; no token is asked for.
[functions.item-image]
verify_jwt = false
