<!--
  The sign-in email (design pack section 6.4 #1). Fixed wording: the code, when it expires, and
  what to do if it wasn't you. Nothing else - no marketing, no app links - because Apple's App
  Review reads this email and so does every new person on their first day.

  Colours are written out here rather than taken from the theme, because email clients do not
  support CSS variables. This file is the one deliberate exception to "no screen names a colour".
-->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#FAF9F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:420px;margin:0 auto;background:#FFFFFF;border:1px solid #E5E3DE;border-radius:16px;">
      <tr>
        <td style="padding:32px 24px;text-align:center;">
          <p style="margin:0 0 20px;font-size:16px;color:#6B6862;">Your Kleit code</p>
          <p style="margin:0;font-size:38px;font-weight:600;letter-spacing:6px;color:#161513;">{{ .Token }}</p>
          <p style="margin:24px 0 0;font-size:16px;color:#161513;">It expires in 10 minutes.</p>
          <p style="margin:12px 0 0;font-size:14px;color:#6B6862;">If you didn't ask for this, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
